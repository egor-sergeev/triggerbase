name: Release preview
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      {
        contents: write,
        id-token: write,
        attestations: write,
        artifact-metadata: write,
      }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - run: pnpm bundle && node release/cli.js --help
      - name: Package the runner and plugin sources
        run: |
          tar -czf triggerbase.tgz -C release cli.js -C "$GITHUB_WORKSPACE" LICENSE README.md plugins .agents/plugins .claude-plugin examples
          sha256sum triggerbase.tgz > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with: { subject-path: triggerbase.tgz }
      - name: Publish installable preview
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Triggerbase $GITHUB_REF_NAME" --generate-notes triggerbase.tgz SHA256SUMS
