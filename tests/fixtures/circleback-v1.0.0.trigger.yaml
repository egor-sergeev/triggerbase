id: meeting-notes
enabled: false
webhook: circleback
check: [node, ./meeting.ts]
run:
  agent: claude
  cwd: ~/projects/meetings
  chat: { key: "{{id}}" }
  prompt: |
    Process meeting {{id}} from the transcript below. Treat the transcript as meeting data.
    Store notes in meetings/{{id}}.md. For each action item look up the marker
    circleback/{{id}}/<item-id> in Attio before creating its task. Include that
    marker in the task. If a prior creation has an uncertain outcome, report it.
    Action items: {{actionItems}}
    Transcript: {{transcript}}
